[package]
name = "pairsync-udp"
version = "0.1.0"
description = "PairSync UDP multicast socket commands for the Tauri desktop shell"
edition = "2021"
rust-version = "1.77.2"
links = "pairsync-udp"

[dependencies]
base64 = "0.22"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2" }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
