[package]
name = "app"
version = "0.1.0"
description = "PairSync — secure peer-to-peer file transfer desktop app"
authors = ["kleva-j <kasmickleva@gmail.com>"]
license = "MIT"
repository = "https://github.com/kleva-j/pairsync"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
pairsync-udp = { path = "plugins/pairsync-udp", version = "0.1.0" }
pairsync-mdns = { path = "plugins/pairsync-mdns", version = "0.1.0" }
pairsync-tcp = { path = "plugins/pairsync-tcp", version = "0.1.0" }
